# PINAS 2026 — scheduled news refresh + GitHub Pages deploy.
#
# The news file is NEVER committed. It is generated at deploy time and shipped
# straight into the Pages artifact, which means the bot makes no commits, your
# branch can never diverge from origin, and `data/auto-news.json` can never
# cause a merge conflict.
#
# Two consequences that shape the design below:
#   1. Jobs don't share a filesystem, so ingest and deploy must be ONE job —
#      otherwise the deploy would check out a repo with no news file in it.
#   2. RSS feeds only expose the last few days, and the archive is built by
#      merging each run into the previous result. With nothing committed, that
#      history lives in the Actions cache instead.
name: Update news & deploy

on:
  schedule:
    # Every 6 hours. Cron on GitHub is always UTC; the Philippines is UTC+8,
    # so these land ~07:17, 13:17, 19:17, 01:17 PHT.
    - cron: "17 23,5,11,17 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and report only — do not deploy"
        type: boolean
        default: false

permissions:
  contents: read   # nothing is committed any more
  pages: write
  id-token: write

concurrency:
  group: pinas2026-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    name: Refresh news and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Carries the accumulated story archive between runs. The key is unique
      # per run so a fresh copy is always saved; restore-keys pulls the newest
      # previous one. A cache miss is harmless — the run just rebuilds from
      # whatever the feeds currently expose.
      - name: Restore news archive
        uses: actions/cache@v4
        with:
          path: data/auto-news.json
          key: pinas2026-news-${{ github.run_id }}
          restore-keys: |
            pinas2026-news-

      - name: Fetch news from allowlisted sources
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/fetch-news.mjs --dry-run | tee ingest.log
          else
            node scripts/fetch-news.mjs | tee ingest.log
          fi

      - name: Publish run summary
        if: always()
        run: |
          {
            echo "### PINAS 2026 news refresh"
            echo ""
            echo '```'
            cat ingest.log || echo "no log produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove build-only files from the published site
        if: ${{ inputs.dry_run != true }}
        run: rm -f ingest.log

      - name: Configure Pages
        if: ${{ inputs.dry_run != true }}
        uses: actions/configure-pages@v5

      - name: Upload site
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        if: ${{ inputs.dry_run != true }}
        uses: actions/deploy-pages@v4
